<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="100%" height="100%" fill="#F5F4EF"/><text x="20" y="32" font-size="20" font-weight="bold" font-family="DejaVu Sans" fill="#333">Karl's Kitchen: system overview</text><rect x="30" y="150" width="220" height="100" rx="14" fill="#E6EEF5" stroke="#355070" stroke-width="3"/><text x="140.0" y="176" fill="#355070" text-anchor="middle" font-size="19" font-weight="bold" font-family="DejaVu Sans">Hall sensors +</text><text x="140.0" y="200" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">3 time buttons</text><text x="140.0" y="217" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">(event checkers)</text><rect x="450" y="140" width="300" height="110" rx="14" fill="#FFFFC2" stroke="#840000" stroke-width="3"/><text x="600.0" y="166" fill="#840000" text-anchor="middle" font-size="19" font-weight="bold" font-family="DejaVu Sans">GameService</text><text x="600.0" y="190" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">the game rules (state machine)</text><text x="600.0" y="207" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">Welcome, SelectTime, Cooking,</text><text x="600.0" y="224" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">Won, Lost, ReturnFood</text><line x1="250" y1="200" x2="450" y2="200" stroke="#840000" stroke-width="2.5"/><polygon points="450.0,200.0 438.9,204.7 438.9,195.3" fill="#840000"/><text x="350" y="118" fill="#006464" text-anchor="middle" font-size="11" font-weight="normal" font-family="DejaVu Sans">ES_FOOD_REMOVED</text><text x="350" y="133" fill="#006464" text-anchor="middle" font-size="11" font-weight="normal" font-family="DejaVu Sans">ES_FOOD_PLACED</text><text x="350" y="148" fill="#006464" text-anchor="middle" font-size="11" font-weight="normal" font-family="DejaVu Sans">ES_TIME_SELECTED (1 to 3)</text><text x="350" y="163" fill="#006464" text-anchor="middle" font-size="11" font-weight="normal" font-family="DejaVu Sans">ES_FOOD_PASSED (LED 0 to 3)</text><rect x="60" y="400" width="300" height="100" rx="14" fill="#FFFFC2" stroke="#840000" stroke-width="3"/><text x="210.0" y="426" fill="#840000" text-anchor="middle" font-size="19" font-weight="bold" font-family="DejaVu Sans">LEDMatrixService</text><text x="210.0" y="450" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">cooked level, clock, messages</text><text x="210.0" y="467" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">(LED matrix)</text><rect x="450" y="400" width="300" height="100" rx="14" fill="#FFFFC2" stroke="#840000" stroke-width="3"/><text x="600.0" y="426" fill="#840000" text-anchor="middle" font-size="19" font-weight="bold" font-family="DejaVu Sans">DisplayChainService</text><text x="600.0" y="450" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">plate LEDs, time-button LEDs,</text><text x="600.0" y="467" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">start-spot LEDs</text><rect x="840" y="400" width="300" height="100" rx="14" fill="#FFFFC2" stroke="#840000" stroke-width="3"/><text x="990.0" y="426" fill="#840000" text-anchor="middle" font-size="19" font-weight="bold" font-family="DejaVu Sans">ActuatorService</text><text x="990.0" y="450" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">plate motor, buzzer ding,</text><text x="990.0" y="467" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">TREAT dispenser</text><line x1="500" y1="250" x2="260" y2="400" stroke="#840000" stroke-width="2.5"/><polygon points="260.0,400.0 266.9,390.2 271.8,398.1" fill="#840000"/><text x="300" y="300" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_MATRIX_CLEAR</text><text x="300" y="315" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_MATRIX_SET_COOKED</text><text x="300" y="330" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_MATRIX_SHOW_CLOCK</text><text x="300" y="345" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_MATRIX_SHOW_MSG</text><line x1="600" y1="250" x2="600" y2="400" stroke="#840000" stroke-width="2.5"/><polygon points="600.0,400.0 595.3,388.9 604.7,388.9" fill="#840000"/><text x="588" y="322" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_CHAIN_SET_ALL</text><text x="588" y="337" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_CHAIN_SET_LED</text><text x="588" y="352" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_CHAIN_FLASH_TIME_LEDS</text><text x="588" y="367" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_CHAIN_SET_START_LEDS</text><line x1="700" y1="250" x2="900" y2="400" stroke="#840000" stroke-width="2.5"/><polygon points="900.0,400.0 888.4,397.1 894.0,389.6" fill="#840000"/><text x="770" y="335" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_PLATE_START / STOP</text><text x="770" y="350" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_PLAY_DING</text><text x="770" y="365" fill="#006464" text-anchor="end" font-size="12" font-weight="normal" font-family="DejaVu Sans">ES_DISPENSE_TREAT</text><rect x="890" y="560" width="200" height="70" rx="14" fill="#E6EEF5" stroke="#355070" stroke-width="3"/><text x="990.0" y="586" fill="#355070" text-anchor="middle" font-size="19" font-weight="bold" font-family="DejaVu Sans">Potentiometer</text><text x="990.0" y="610" fill="#006464" text-anchor="middle" font-size="13" font-weight="normal" font-family="DejaVu Sans">(analog input)</text><line x1="990" y1="560" x2="990" y2="500" stroke="#840000" stroke-width="2.5"/><polygon points="990.0,500.0 994.7,511.1 985.3,511.1" fill="#840000"/><text x="1005" y="535" fill="#006464" text-anchor="start" font-size="12" font-weight="normal" font-family="DejaVu Sans">plate angle</text><text x="30" y="610" fill="#006464" text-anchor="start" font-size="13" font-weight="normal" font-family="DejaVu Sans">Yellow boxes are services (software). Gray boxes are hardware inputs.</text><text x="30" y="632" fill="#006464" text-anchor="start" font-size="13" font-weight="normal" font-family="DejaVu Sans">Arrows show events. Only GameService decides what happens next.</text></svg>